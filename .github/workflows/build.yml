name: Build RemoteDesk (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build EXE (PyInstaller)
        run: pyinstaller remote_desk.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc setup.iss
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-exe
          path: dist/RemoteDesk.exe
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-installer
          path: release/Setup-RemoteDesk-*.exe
      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RemoteDesk.exe
            release/Setup-RemoteDesk-*.exe
          generate_release_notes: true
