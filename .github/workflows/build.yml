name: Build RemoteDesk (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build EXE (PyInstaller)
        run: pyinstaller remote_desk.spec
      - name: Smoke-test built EXE (v1.0.10)
        # "Upar test karo": the portable EXE must at least START on a
        # real Windows runner BEFORE any asset ships. --version exits
        # before any GUI/Tk code runs, so this proves the one-file
        # bundle extracts and the Python DLL (python311.dll) loads.
        # Start-Process + WaitForExit(60s): if the bootloader ever
        # fails with a "Failed to load Python DLL" message box, the
        # step times out and FAILS the build instead of hanging.
        # A windowed (console=False) EXE has no stdout, so the check
        # is exit-code based; run.py --version prints the version
        # when run from source.
        run: |
          $p = Start-Process -FilePath "dist\RemoteDesk.exe" -ArgumentList "--version" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "SMOKE FAIL: dist RemoteDesk.exe --version timed out (60s) - bundle likely failed to extract/load" }
          if ($p.ExitCode -ne 0) { throw "SMOKE FAIL: dist RemoteDesk.exe --version exited $($p.ExitCode) - bundle did not start" }
          Write-Host "Smoke OK: dist RemoteDesk.exe --version exited 0"
      - name: Verify EXE icon (v1.0.7)
        # The desktop icon pointed at {app}\RemoteDesk.exe, so a silently
        # missing embedded icon meant a generic default desktop icon.
        # Fail the build if the EXE has no RT_GROUP_ICON / RT_ICON
        # resources, so a bad icon can never ship silently again.
        run: |
          pip install pefile
          python -c "import pefile, sys; pe = pefile.PE('dist\\RemoteDesk.exe'); res = getattr(pe, 'DIRECTORY_ENTRY_RESOURCE', None); types = {e.struct.Id for e in res.entries} if res else set(); print('resource types:', sorted(types)); print('EXE icon OK' if 14 in types and 3 in types else 'FAIL: EXE has no RT_GROUP_ICON(14)/RT_ICON(3) - icon would show as default'); sys.exit(0 if 14 in types and 3 in types else 1)"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc setup.iss
      - name: Smoke-test installed EXE (v1.0.10)
        # Same guarantee for the installer path: silent-install into
        # a temp dir on the runner, then the INSTALLED EXE must also
        # start (--version, exit 0). Catches installer-packaging
        # regressions (missing files, broken install dir) before
        # the release ever publishes.
        run: |
          $installer = Get-ChildItem release\Setup-RemoteDesk-*.exe | Select-Object -First 1
          if (-not $installer) { throw "SMOKE FAIL: no installer found in release" }
          $dir = "$env:RUNNER_TEMP\RemoteDesk-smoke"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$dir"
          if ($LASTEXITCODE -ne 0) { throw "SMOKE FAIL: silent installer exited $LASTEXITCODE" }
          $installed = Join-Path $dir "RemoteDesk.exe"
          if (-not (Test-Path $installed)) { throw "SMOKE FAIL: installed EXE missing at $installed" }
          $p = Start-Process -FilePath $installed -ArgumentList "--version" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "SMOKE FAIL: installed RemoteDesk.exe --version timed out (60s)" }
          if ($p.ExitCode -ne 0) { throw "SMOKE FAIL: installed RemoteDesk.exe --version exited $($p.ExitCode)" }
          Write-Host "Smoke OK: installed RemoteDesk.exe --version exited 0"
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-exe
          path: dist/RemoteDesk.exe
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-installer
          path: release/Setup-RemoteDesk-*.exe
      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RemoteDesk.exe
            release/Setup-RemoteDesk-*.exe
          generate_release_notes: true
